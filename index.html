<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хроника государств</title>
<meta name="description" content="Карта мира и статистика государств военно-политической игры ВПИ">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 2h20v26l-10-6-10 6z' fill='%23FFD700'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="bar">
  <div class="bar__title">
    <h1>Хроника государств</h1>
    <p class="bar__sub" id="turnInfo">Загрузка…</p>
  </div>
  <button class="btn" id="loginBtn" type="button">Войти</button>
</header>

<main class="stage">
  <div id="map" aria-label="Карта мира"></div>

  <nav class="roster" id="roster" aria-label="Государства">
    <button class="roster__toggle" id="rosterToggle" type="button" aria-expanded="true">Государства</button>
    <ul class="roster__list" id="rosterList"></ul>
  </nav>

  <aside class="panel" id="panel" aria-live="polite" hidden>
    <button class="panel__close" id="panelClose" type="button" aria-label="Закрыть">×</button>
    <div class="panel__body" id="panelBody"></div>
  </aside>
</main>

<dialog class="login" id="loginDialog">
  <form method="dialog" id="loginForm" class="login__form">
    <h2>Вход правителя</h2>
    <p class="login__hint">Логин и пароль выдаёт администратор игры.</p>
    <label>Логин <input name="login" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <p class="login__error" id="loginError" role="alert"></p>
    <div class="login__actions">
      <button class="btn btn--ghost" value="cancel" formnovalidate type="submit">Отмена</button>
      <button class="btn" id="loginSubmit" type="submit" value="ok">Войти</button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<script src="assets/app.js"></script>
</body>
</html>
